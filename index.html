<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DistribOS Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body { margin:0; font-family: 'Inter', Arial; background:#0f172a; color:#e2e8f0; }
header { padding:16px; text-align:center; font-size:20px; background:#020617; }
.container { padding:16px; max-width:900px; margin:auto; }
.card { background:#1e293b; padding:16px; border-radius:16px; margin-bottom:16px; }
input, select { width:100%; padding:10px; margin:6px 0; border-radius:8px; border:none; }
button { width:100%; padding:12px; border:none; border-radius:10px; background:#3b82f6; color:white; margin-top:8px; }
.cart-item { padding:8px; border-bottom:1px solid #334155; }
</style>
</head>

<body>

<header>DistribOS Pro 🚀</header>

<div class="container" id="authSection">
  <div class="card">
    <h3>Login</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<div class="container" id="appSection" style="display:none">
  <div class="card">
    <h3 id="userName"></h3>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h3>Create Invoice</h3>
    <input id="salesmanName" placeholder="Salesman Name">
    <input id="shopLocation" placeholder="Shop Location">
    <select id="partySelect"></select>

    <select id="itemSelect"></select>
    <input id="qty" type="number" placeholder="Qty">

    <button onclick="addToCart()">Add Item</button>

    <div id="cart"></div>
    <h3 id="total">₹0</h3>

    <button onclick="createInvoice()">Generate Invoice</button>
  </div>

  <div class="card">
    <h3>Route Export</h3>
    <button onclick="loadRoutes()">Load Stops</button>
    <ul id="routes"></ul>
    <button onclick="exportCSV()">Export CSV</button>
  </div>
</div>

<script>
window.onload = function(){

const firebaseConfig = {
  apiKey: "AIzaSyDwAc_BGB72lvBypqBnzgBrENRwgE4ks7w",
  authDomain: "distribos-30983.firebaseapp.com",
  projectId: "distribos-30983",
  storageBucket: "distribos-30983.firebasestorage.app",
  messagingSenderId: "588623787753",
  appId: "1:588623787753:web:79df65b09e659d81e92278"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let cart = [];
let items = [];
let routes = [];

window.login = function(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(()=>auth.createUserWithEmailAndPassword(email.value,password.value));
}

window.logout = function(){ auth.signOut(); }

auth.onAuthStateChanged(user=>{
  if(user){
    authSection.style.display='none';
    appSection.style.display='block';
    userName.innerText=user.email;
    loadData();
  } else {
    authSection.style.display='block';
    appSection.style.display='none';
  }
});

async function loadData(){
  let p = await db.collection('parties').get();
  let i = await db.collection('items').get();

  partySelect.innerHTML='';
  itemSelect.innerHTML='';
  items=[];

  p.forEach(d=>partySelect.innerHTML+=`<option>${d.data().name}</option>`);
  i.forEach(d=>{
    items.push(d.data());
    itemSelect.innerHTML+=`<option value="${items.length-1}">${d.data().name}</option>`;
  });
}

window.addToCart = function(){
  let item = items[itemSelect.value];
  let q = parseInt(qty.value);
  let total = item.price * q;

  cart.push({name:item.name, qty:q, total});
  renderCart();
}

function renderCart(){
  let html='', total=0;
  cart.forEach(c=>{
    total+=c.total;
    html+=`<div class="cart-item">${c.name} x ${c.qty} = ₹${c.total}</div>`;
  });
  document.getElementById('cart').innerHTML=html;
  document.getElementById('total').innerText="₹"+total;
}

window.createInvoice = async function(){
  await db.collection('invoices').add({
    salesmanName:salesmanName.value,
    location:shopLocation.value,
    party:partySelect.value,
    cart,
    total:cart.reduce((s,c)=>s+c.total,0),
    date:new Date()
  });
  alert("Invoice Created");
  cart=[]; renderCart();
}

window.loadRoutes = async function(){
  let snap = await db.collection('invoices').get();
  routes=[];
  routesList.innerHTML='';
  snap.forEach(d=>{
    let data=d.data();
    routes.push(data);
    routes.innerHTML+=`<li>${data.party} - ${data.location}</li>`;
  });
}

window.exportCSV = function(){
  let csv="Party,Location\n";
  routes.forEach(r=>csv+=`${r.party},${r.location}\n`);
  let blob=new Blob([csv]);
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download="routes.csv";
  a.click();
}

}
</script>

</body>
</html>
